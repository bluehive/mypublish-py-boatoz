[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "mypublish-py-boatoz"
version = "0.1.0"
description = "ボートレースを題材に学ぶPython統計入門"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
authors = [{name = "bluehive"}]
dependencies = ["pandas>=2.2,<4", "matplotlib>=3.9,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]
[project.scripts]
boatoz = "boatoz.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
